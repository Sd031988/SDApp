<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Handy-Scanner – SD PDF Studio</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    #topBar {
      padding: 10px 16px;
      text-align: center;
      background: #0f172a;
      flex-shrink: 0;
    }

    #topBar h1 {
      font-size: 1rem;
      margin: 0 0 2px;
    }

    #status {
      font-size: .85rem;
      font-weight: 600;
      color: #9fb3c8;
    }

    #cameraWrap {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #guideFrame {
      position: absolute;
      top: 6%;
      left: 6%;
      right: 6%;
      bottom: 6%;
      border: 3px dashed rgba(255, 255, 255, .75);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, .25);
    }

    #hint {
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: .85rem;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
      pointer-events: none;
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    #flash.active {
      opacity: .85;
      transition: opacity .25s ease-out;
    }

    #bottomBar {
      flex-shrink: 0;
      background: #0f172a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #btnCapture {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #d66b45;
      border: 5px solid #fff;
      cursor: pointer;
    }

    #btnCapture:disabled {
      background: #445164;
      opacity: .6;
    }

    #btnCapture:active {
      transform: scale(.94);
    }

    .btn-secondary {
      background: transparent;
      color: #9fb3c8;
      border: 1px solid #445164;
      font-size: .9rem;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 12px;
      cursor: pointer;
    }

    #count {
      font-size: .85rem;
      color: #9fb3c8;
    }

    #permissionScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #permissionScreen p {
      color: #9fb3c8;
      font-size: .95rem;
      max-width: 300px;
    }

    .icon {
      font-size: 2.4rem;
      margin-bottom: 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="topBar">
    <h1>📱 Handy-Scanner</h1>
    <div id="status">Verbinde …</div>
  </div>

  <div id="permissionScreen">
    <div class="icon">📷</div>
    <p>Kamera wird angefragt – bitte im Browser erlauben.</p>
  </div>

  <div id="cameraWrap" class="hidden">
    <video id="video" autoplay playsinline muted></video>
    <div id="guideFrame"></div>
    <div id="hint">Dokument in den Rahmen halten, dann unten scannen</div>
    <div id="flash"></div>
  </div>

  <div id="bottomBar" class="hidden">
    <button id="btnCapture" disabled title="Scannen"></button>
    <div id="count"></div>
    <button id="btnDone" class="btn-secondary">Fertig – Verbindung beenden</button>
  </div>

  <canvas id="captureCanvas" class="hidden"></canvas>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get('p');
    const statusEl = document.getElementById('status');
    const permissionScreen = document.getElementById('permissionScreen');
    const cameraWrap = document.getElementById('cameraWrap');
    const bottomBar = document.getElementById('bottomBar');
    const video = document.getElementById('video');
    const btn = document.getElementById('btnCapture');
    const btnDone = document.getElementById('btnDone');
    const countEl = document.getElementById('count');
    const flashEl = document.getElementById('flash');
    const canvas = document.getElementById('captureCanvas');

    let sent = 0;
    let conn = null;
    let peer = null;
    let stream = null;
    let connReady = false;
    let cameraReady = false;

    function updateCaptureEnabled() {
      btn.disabled = !(connReady && cameraReady);
    }

    // --- PeerJS-Verbindung zum PC ---
    if (!targetId) {
      statusEl.textContent = 'Kein PC gefunden. Bitte QR-Code am PC neu scannen.';
    } else if (typeof Peer === 'undefined') {
      statusEl.textContent = 'Keine Internetverbindung.';
    } else {
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetId, { reliable: true });

        conn.on('open', () => {
          connReady = true;
          statusEl.textContent = 'Verbunden mit PC ✓';
          updateCaptureEnabled();
        });

        conn.on('close', () => {
          connReady = false;
          statusEl.textContent = 'Verbindung beendet.';
          updateCaptureEnabled();
        });

        conn.on('error', () => {
          connReady = false;
          statusEl.textContent = 'Verbindungsfehler.';
          updateCaptureEnabled();
        });
      });

      peer.on('error', () => {
        statusEl.textContent = 'Verbindung fehlgeschlagen. Bitte QR-Code am PC neu scannen.';
      });
    }

    // --- Live-Kamera starten (kein Foto wird im Handy gespeichert) ---
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1600 }, height: { ideal: 2000 } },
          audio: false
        });
        video.srcObject = stream;
        permissionScreen.classList.add('hidden');
        cameraWrap.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
        cameraReady = true;
        updateCaptureEnabled();
      } catch (err) {
        permissionScreen.innerHTML = '<div class="icon">🚫</div><p>Kein Kamerazugriff. Bitte in den Browser-Einstellungen erlauben und die Seite neu laden.</p>';
      }
    }
    startCamera();

    // --- Aktuellen Kamera-Frame greifen und an PC senden (nur aus dem Live-Bild, keine eigene Fotodatei) ---
    btn.onclick = () => {
      if (!conn || !conn.open || !stream) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;

      canvas.width = vw;
      canvas.height = vh;
      canvas.getContext('2d').drawImage(video, 0, 0, vw, vh);

      flashEl.classList.add('active');
      setTimeout(() => flashEl.classList.remove('active'), 200);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      conn.send({ type: 'photo', name: 'Handyscan_' + (sent + 1) + '.jpg', mime: 'image/jpeg', data: dataUrl });
      sent++;
      countEl.textContent = sent + ' Seite(n) gesendet ✓ – nächste Seite in den Rahmen halten';
    };

    btnDone.onclick = () => {
      if (conn) { try { conn.close(); } catch (e) { } }
      if (peer) { try { peer.destroy(); } catch (e) { } }
      if (stream) { try { stream.getTracks().forEach(t => t.stop()); } catch (e) { } }
      cameraWrap.classList.add('hidden');
      bottomBar.classList.add('hidden');
      permissionScreen.classList.remove('hidden');
      permissionScreen.innerHTML = '<div class="icon">✅</div><p>Verbindung beendet. Du kannst das Fenster schließen.</p>';
    };
  </script>
</body>

</html>
