<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handy-Scanner – SD PDF Studio</title>
  <!-- Frueher eigene Scan-Seite. Jetzt scannt das Handy mit dem SD Scanner
       (Live-Kamera mit Kantenerkennung) und sendet die Seiten an den PC.
       Diese Seite leitet aeltere QR-Codes dorthin weiter. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get('p');
      location.replace('../scanner/' + (p ? '?pc=' + encodeURIComponent(p) : ''));
    })();
  </script>
</head>
<body style="font-family:sans-serif;background:#0f172a;color:#fff;padding:24px;text-align:center">
  <p>Weiter zum SD Scanner …</p>
</body>
</html>
