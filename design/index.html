// ---------- Darstellung ----------
function dsHgCss(hg){return hg.art==="verlauf"?"linear-gradient("+(hg.winkel||135)+"deg,"+hg.a+","+hg.b+")":hg.art==="radial"?"radial-gradient(circle at 30% 30%,"+hg.a+","+hg.b+")":hg.a}
function dsEsc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function dsElStil(e,einheit){const u=einheit||(v=>v+"px");const s=["position:absolute","left:"+u(e.x,"x"),"top:"+u(e.y,"y"),"width:"+u(e.w,"x"),"opacity:"+(e.deck==null?1:e.deck),"box-sizing:border-box"];
  if(e.rot)s.push("transform:rotate("+e.rot+"deg)");
  if(e.typ==="text"){s.push("min-height:"+u(e.h,"y"),"font-size:"+u(e.fs,"f"),"color:"+e.farbe,"font-family:"+e.font,"font-weight:"+(e.gewicht||400),"text-align:"+(e.ausr||"left"),"line-height:"+(e.zeile||1.2),"white-space:pre-wrap","word-wrap:break-word","margin:0");
    if(e.kursiv)s.push("font-style:italic");if(e.schatten)s.push("text-shadow:0 "+u(e.schatten/3,"f")+" "+u(e.schatten,"f")+" rgba(0,0,0,.45)");if(e.abstand)s.push("letter-spacing:"+u(e.abstand,"f"))}
  else{s.push("height:"+u(e.h,"y"),"background:"+(e.bild?"center/"+(e.passung||"cover")+" no-repeat url("+e.bild+")":e.hg),"border-radius:"+(e.typ==="kreis"?"50%":u(e.rund||0,"f")));
    if(e.rand)s.push("border:"+u(e.rand,"f")+" solid "+(e.randFarbe||"#000"));if(e.schatten)s.push("box-shadow:0 "+u(e.schatten/2,"f")+" "+u(e.schatten,"f")+" rgba(0,0,0,.35)");
    if(e.typ==="knopf")s.push("display:flex","align-items:center","justify-content:center","text-align:center","font-size:"+u(e.fs||32,"f"),"color:"+(e.farbe||"#fff"),"font-family:"+(e.font||DS_SCHRIFTEN[0][1]),"font-weight:"+(e.gewicht||700),"text-decoration:none","cursor:pointer")}
  return s.join(";")}
function dsZeichnen(){const f=$("dsFlaeche");if(!f||!DS.d)return;const d=DS.d;
  f.style.width=d.w+"px";f.style.height=d.h+"px";f.style.background=dsHgCss(d.hg);f.style.transform="scale("+DS.zoom+")";
  $("dsBuehne").style.width=d.w*DS.zoom+"px";$("dsBuehne").style.height=d.h*DS.zoom+"px";
  f.innerHTML="";d.els.forEach(e=>{const n=document.createElement("div");n.className="dsEl"+(DS.sel===e.id?" sel":"");n.dataset.id=e.id;n.style.cssText=dsElStil(e);
    if(e.typ==="text"||e.typ==="knopf")n.textContent=e.text||"";if(e.gesperrt)n.classList.add("lock");
    if(DS.sel===e.id&&!e.gesperrt)["nw","ne","sw","se"].forEach(k=>{const g=document.createElement("i");g.className="dsGriff "+k;g.dataset.griff=k;g.style.transform="scale("+(1/DS.zoom)+")";n.appendChild(g)});
    f.appendChild(n)});
  dsEigenschaften();dsEbenen()}
function dsAnpassen(){const b=$("dsMitte");if(!b||!DS.d)return;DS.zoom=Math.min((b.clientWidth-60)/DS.d.w,(b.clientHeight-60)/DS.d.h,1.5);DS.zoom=Math.max(.08,DS.zoom);dsZeichnen();$("dsZoomW").textContent=Math.round(DS.zoom*100)+"%"}
// ---------- Verlauf (Rückgängig) ----------
function dsMerken(){DS.verlauf.push(JSON.stringify(DS.d));if(DS.verlauf.length>80)DS.verlauf.shift();DS.zukunft=[];dsAutoSichern()}
function dsZurueck(){if(!DS.verlauf.length)return;DS.zukunft.push(JSON.stringify(DS.d));DS.d=JSON.parse(DS.verlauf.pop());dsZeichnen()}
function dsVor(){if(!DS.zukunft.length)return;DS.verlauf.push(JSON.stringify(DS.d));DS.d=JSON.parse(DS.zukunft.pop());dsZeichnen()}

function dsSel(){return DS.d&&DS.d.els.find(e=>e.id===DS.sel)}

function dsHinzu(e){dsMerken();const d=DS.d;if(e.x==null){e.x=Math.round((d.w-e.w)/2);e.y=Math.round((d.h-(e.h||100))/2)}d.els.push(e);DS.sel=e.id;dsZeichnen()}

  else if(typ==="box")dsHinzu(dsForm("box",null,null,Math.round(k*.5),Math.round(k*.3),p[4],{rund:Math.round(k*.02)}));

function dsPalette(){return DS.d.palette||["#ffffff","#111111","#2563eb","#333333","#93c5fd"]}
function dsBildLaden(datei){if(!datei)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=1600,f=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);const url=c.toDataURL(/png/i.test(datei.type)?"image/png":"image/jpeg",.88);
    const d=DS.d,s=Math.min(d.w*.6/c.width,d.h*.6/c.height,1);const e=dsForm("bild",null,null,Math.round(c.width*s),Math.round(c.height*s),"transparent",{bild:url,passung:"cover"});
    const alt=dsSel();if(alt&&alt.typ!=="text"&&DS.wartetBild){dsMerken();alt.bild=url;DS.wartetBild=false;dsZeichnen()}else dsHinzu(e)};img.src=r.result};r.readAsDataURL(datei)}
// ---------- Ziehen / Größe ändern / Hilfslinien ----------
function dsMaus(ev){const n=ev.target.closest(".dsEl"),griff=ev.target.dataset&&ev.target.dataset.griff;
  if(!n){if(ev.target.id==="dsFlaeche"||ev.target.id==="dsMitte"||ev.target.id==="dsBuehne"){DS.sel=null;dsZeichnen()}return}
  const e=DS.d.els.find(x=>x.id===n.dataset.id);if(!e)return;if(DS.sel!==e.id){DS.sel=e.id;dsZeichnen()}if(e.gesperrt)return;
  if(n.isContentEditable)return;ev.preventDefault();
  const sx=ev.clientX,sy=ev.clientY,o={x:e.x,y:e.y,w:e.w,h:e.h,fs:e.fs},z=DS.zoom;let bewegt=false;
  const mv=m=>{const dx=(m.clientX-sx)/z,dy=(m.clientY-sy)/z;if(!bewegt&&Math.abs(dx)+Math.abs(dy)<2)return;if(!bewegt){dsMerken();bewegt=true}
    if(griff){let nw=o.w+(griff.includes("e")?dx:-dx),nh=o.h+(griff.includes("s")?dy:-dy);
      if(m.shiftKey||e.typ==="kreis"||e.typ==="bild"&&!m.altKey){const r=o.h/o.w;nh=nw*r}
      nw=Math.max(10,nw);nh=Math.max(4,nh);e.w=Math.round(nw);e.h=Math.round(nh);
      if(griff.includes("w"))e.x=Math.round(o.x+(o.w-nw));if(griff.includes("n"))e.y=Math.round(o.y+(o.h-nh));
      if(e.typ==="text"&&o.fs)e.fs=Math.max(6,Math.round(o.fs*nw/o.w))}
    else{let nx=o.x+dx,ny=o.y+dy;const linien=[];
      if(DS.raster){const d=DS.d,fang=8/z,ziele=[[d.w/2,"x",0.5],[0,"x",0],[d.w,"x",1]],zy=[[d.h/2,"y",0.5],[0,"y",0],[d.h,"y",1]];
