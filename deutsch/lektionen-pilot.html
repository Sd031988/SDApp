<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Hub · Lernlektionen Pilot</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{background:#10121c;color:#f4f4fb;margin:0}main{max-width:760px;margin:auto;padding:20px}a{color:#b9a2ff}button,textarea{font:inherit}button{border:1px solid #6d5fc9;background:#24253b;color:white;border-radius:12px;padding:12px;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #b9a2ff}.levels{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.levels button[aria-pressed=true]{background:#6548c6}section{background:#1b1d2c;padding:20px;border-radius:16px;margin:12px 0}p,li{line-height:1.6}textarea{width:100%;min-height:125px;box-sizing:border-box;border-radius:12px;padding:12px;background:#0e1020;color:white;border:1px solid #777}small{color:#c4c5d5}.check{margin:12px 0}</style></head><body><main><p><a href="./">← Zum Deutschkurs</a></p><h1>📚 Lernlektionen · Pilot</h1><p>Vier neue Übungslektionen. Deine Texte werden nur auf diesem Gerät gespeichert. Die Selbstkontrolle ist keine offizielle GER-Einstufung.</p><nav class="levels" aria-label="Lernstufe" id="levels"></nav><article id="lesson" aria-live="polite"></article></main><script>
"use strict";
const lessons=[
{id:"alpha",level:"Alphabetisierung",title:"M und m erkennen",goal:"Du erkennst den Laut M und liest erste Silben.",words:["Mama","Maus","Milch","Mond"],rule:"M wie Mama. Sprich /m/ mit geschlossenen Lippen. Lies: ma – me – mi – mo – mu.",reading:"Mama. Mimi.",question:"Welche Wörter beginnen mit M: Maus, Haus, Milch, Auto?",answer:"Maus und Milch",task:"Schreibe M, m und Mama. Nenne ein eigenes Wort mit M.",hint:"Kontrolliere Buchstaben, Laut und Leserichtung. Für Aussprache brauchst du Rückmeldung."},
{id:"a1",level:"A1",title:"Sich vorstellen",goal:"Du kannst deinen Namen, Herkunft, Wohnort und deine Sprachen nennen.",words:["heißen","kommen","wohnen","sprechen","der Name","die Stadt"],rule:"Im Aussagesatz steht das Verb an zweiter Stelle: Ich wohne in Bonn. Frage: Wo wohnst du?",reading:"Hallo, ich bin Amir. Ich komme aus Syrien und wohne in Köln. Ich spreche Arabisch und Deutsch.",question:"Wo wohnt Amir und welche Sprachen spricht er?",answer:"In Köln. Arabisch und Deutsch.",task:"Schreibe vier Sätze über dich. Stelle dich anschließend laut vor.",hint:"Achte auf vollständige Angaben und passende Verbformen."},
{id:"a2",level:"A2",title:"Einen Termin verschieben",goal:"Du kannst höflich einen Termin ändern und einen Grund nennen.",words:["der Termin","verschieben","leider","möglich","die Uhrzeit"],rule:"Nach weil steht das Verb am Ende: Ich komme nicht, weil ich arbeiten muss.",reading:"Guten Tag, Frau Weber. Leider kann ich am Dienstag nicht kommen, weil ich arbeiten muss. Könnten wir den Termin auf Donnerstag um 10 Uhr verschieben?",question:"Warum kann die Person nicht kommen? Wann schlägt sie einen Termin vor?",answer:"Sie muss arbeiten. Donnerstag um 10 Uhr.",task:"Schreibe eine höfliche E-Mail: Mittwoch 9 Uhr passt wegen Krankheit nicht. Bitte um Freitag 11 Uhr.",hint:"Prüfe Anrede, Begründung, neuen Termin und Gruß."},
{id:"b1",level:"B1",title:"Bus oder Auto? Eine Meinung begründen",goal:"Du kannst eine Position, zwei Argumente und einen Einwand formulieren.",words:["einerseits","andererseits","allerdings","die Umwelt","die Kosten","zuverlässig"],rule:"Obwohl leitet einen Nebensatz ein: Obwohl der Bus spät kommt, nutze ich ihn.",reading:"In unserer Stadt fahren seit September mehr Busse am Abend. Einige Bewohner begrüßen das Angebot, weil sie kein Auto besitzen. Andere kritisieren, dass die Haltestellen weit von ihren Wohnungen entfernt sind.",question:"Was ist ein Vorteil? Was kritisieren andere?",answer:"Mehr Busse am Abend helfen Menschen ohne Auto. Manche Haltestellen sind weit entfernt.",task:"Schreibe etwa 100–130 Wörter: Bus oder Auto? Begründe deine Meinung mit zwei Argumenten und einem Gegenargument.",hint:"Prüfe Aufgabenbewältigung, Aufbau, Wortschatz und Verständlichkeit."}
];
const nav=document.getElementById("levels"),out=document.getElementById("lesson");let current=0;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function render(){nav.replaceChildren();lessons.forEach((l,i)=>{const b=el("button",l.level);b.type="button";b.setAttribute("aria-pressed",String(i===current));b.onclick=()=>{current=i;render()};nav.append(b)});const l=lessons[current];out.replaceChildren();const s=el("section");s.append(el("h2",l.title),el("h3","Lernziel"),el("p",l.goal),el("h3","Wortschatz"),el("p",l.words.join(" · ")),el("h3","Erklärung"),el("p",l.rule),el("h3","Lesen"),el("p",l.reading),el("h3","Verständnisfrage"),el("p",l.question));const show=el("button","Musterantwort anzeigen"),answer=el("p");show.onclick=()=>{answer.textContent=l.answer};s.append(show,answer,el("h3","Selbst schreiben und sprechen"),el("p",l.task));const label=el("label","Deine Antwort:");const field=el("textarea");field.id="answer";label.htmlFor="answer";field.value=localStorage.getItem("sdhub-pilot-"+l.id)||"";field.oninput=()=>localStorage.setItem("sdhub-pilot-"+l.id,field.value);const status=el("p");status.setAttribute("role","status");const save=el("button","Antwort speichern");save.onclick=()=>{localStorage.setItem("sdhub-pilot-"+l.id,field.value);status.textContent="Gespeichert auf diesem Gerät. Die Antwort wurde nicht automatisch bewertet."};const hint=el("p",l.hint);const done=el("input");done.type="checkbox";done.id="review";done.checked=localStorage.getItem("sdhub-pilot-reviewed-"+l.id)==="true";done.onchange=()=>localStorage.setItem("sdhub-pilot-reviewed-"+l.id,String(done.checked));const doneLabel=el("label"," Ich habe meine Antwort selbst überprüft (keine bestandene Prüfung).");doneLabel.htmlFor="review";s.append(label,field,save,status,el("h3","Selbstkontrolle"),hint,done,doneLabel);out.append(s)}
try{render()}catch(e){out.textContent="Die Lektionen konnten nicht geladen werden."}
</script></body></html>
