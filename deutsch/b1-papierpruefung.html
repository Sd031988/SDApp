<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Hub · B1 Prüfungsbogen A4</title><style>body{font:15px Arial,sans-serif;background:#e9edf3;color:#161616;margin:0}.tools{padding:18px;background:#183f78;color:white;position:sticky;top:0;z-index:2}.tools select,.tools button{font:inherit;padding:9px;margin:4px;border-radius:5px}.tools button{background:#fff;border:0;cursor:pointer}.page{background:white;width:210mm;min-height:297mm;margin:16px auto;box-sizing:border-box;padding:20mm 18mm;box-shadow:0 4px 18px #0002;position:relative;page-break-after:always}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;border-bottom:3px solid #222;padding-bottom:8px}.big{font-size:34px;margin:38px 0 10px}.line{border-bottom:1px solid #777;display:inline-block;min-width:60%;height:20px}.field{margin:24px 0}.section{border:2px solid #333;padding:13px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bubble{display:inline-block;width:16px;height:16px;border:1.5px solid #111;border-radius:50%;vertical-align:middle;margin:0 8px}.answer{border-bottom:1px solid #999;height:25px}.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:7px 0;break-inside:avoid}.num{width:32px;font-weight:bold}.options{margin-left:auto}.pagefooter{position:absolute;bottom:13mm;left:18mm;right:18mm;border-top:1px solid #aaa;padding-top:8px;font-size:11px;display:flex;justify-content:space-between}.muted{color:#555}.writing{height:220mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,#bbb 31px,transparent 32px)}@media(max-width:900px){.page{width:100%;min-height:auto;padding:22px;margin:12px auto}.pagefooter{position:static;margin-top:40px}}@media print{@page{size:A4;margin:0}body{background:white}.tools{display:none}.page{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;break-after:page}.page:last-child{break-after:auto}}</style></head><body><div class="tools"><strong>SD Hub · Papier-Prüfungsmodus</strong> <label>Prüfung <select id="type"><option value="goethe">Goethe B1</option><option value="telc">telc Deutsch B1</option><option value="dtz">DTZ A2–B1</option></select></label> <label>Übungssatz <select id="set"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button onclick="window.print()">🖨️ Als PDF speichern / Drucken</button><button onclick="location.href='./'">Zurück</button><p>Eigenständige A4-Übungsvorlage, keine Kopie eines offiziellen Antwortbogens. Die Aufgaben bearbeitest du im interaktiven Prüfungstraining.</p></div><div id="pages"></div><script>
const formats={goethe:{title:'Goethe-Zertifikat B1',parts:[['Lesen',30,'a b c'],['Hören',30,'a b c'],['Schreiben',3,'text'],['Sprechen',3,'oral']]},telc:{title:'telc Deutsch B1',parts:[['Leseverstehen',20,'a b c'],['Sprachbausteine',20,'a b c'],['Hörverstehen',20,'a b c'],['Schriftlicher Ausdruck',1,'text'],['Mündlicher Ausdruck',3,'oral']]},dtz:{title:'Deutsch-Test für Zuwanderer (A2–B1)',parts:[['Hören',20,'a b c'],['Lesen',25,'a b c'],['Schreiben',1,'text'],['Sprechen',3,'oral']]}};
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function footer(n){return '<div class="pagefooter"><span>SD Hub · eigenes B1-Prüfungstraining · keine offizielle Prüfungsunterlage</span><span>Seite '+n+'</span></div>'}function page(inner,n){return '<section class="page">'+inner+footer(n)+'</section>'}
function render(){let f=formats[document.getElementById('type').value],set=document.getElementById('set').value,n=1;let out=page('<div class="eyebrow">SD Hub · Prüfungsübung</div><h1 class="big">'+E(f.title)+'</h1><h2>Übungssatz '+set+' · Kandidatenheft und Antwortbogen</h2><div class="field">Name: <span class="line"></span></div><div class="field">Vorname: <span class="line"></span></div><div class="field">Teilnehmernummer: <span class="line"></span></div><div class="field">Datum: <span class="line"></span></div><div class="section"><strong>Hinweise</strong><p>Dieses Heft zeigt den papierbasierten Prüfungsablauf. Bearbeite die Aufgaben im SD Hub B1-Prüfungstraining und trage deine Antworten hier ein.</p><p>Verwende für die Antworten einen Stift. Prüfe die Aufgabenummern und schreibe deutlich. Für Schreiben und Sprechen gelten eigene Bewertungsregeln.</p><p><strong>Achtung:</strong> Diese Vorlage ist kein offizieller Prüfungsbogen und enthält keine amtlichen Prüfungsaufgaben.</p></div><p class="muted">Die Gestaltung orientiert sich an typischen A4-Kandidaten- und Antwortbögen. Die tatsächlichen Prüfungsunterlagen können anders aussehen.</p>',n++);for(let [title,count,mode] of f.parts){if(mode==='text'){for(let i=1;i<=count;i++)out+=page('<div class="eyebrow">'+E(f.title)+' · Übungssatz '+set+'</div><h2>'+E(title)+' · Aufgabe '+i+'</h2><p>Name / Teilnehmernummer: _______________________________________</p><p>Schreibe deinen Text deutlich und vollständig auf die Linien.</p><div class="writing"></div>',n++)}else if(mode==='oral'){out+=page('<div class="eyebrow">'+E(f.title)+' · Übungssatz '+set+'</div><h2>'+E(title)+' · Vorbereitung</h2><p>Teil 1–3: Nutze diese Seite für Stichpunkte. Sprich in der Prüfung möglichst frei und vollständig.</p><div class="writing"></div>',n++)}else{let rows=Array.from({length:count},(_,i)=>'<div class="row"><span class="num">'+(i+1)+'</span><span class="options">'+mode.split(' ').map(x=>'<span class="bubble"></span>'+x.toUpperCase()+' ').join('')+'</span></div>');let per=25;for(let k=0;k<rows.length;k+=per)out+=page('<div class="eyebrow">'+E(f.title)+' · Übungssatz '+set+'</div><h2>Antwortbogen · '+E(title)+'</h2><p>Kreuze pro Aufgabe nur eine Antwort an. Trage die Antworten entsprechend den Aufgaben im digitalen Übungssatz ein.</p>'+rows.slice(k,k+per).join(''),n++)}}document.getElementById('pages').innerHTML=out}
document.getElementById('type').onchange=render;document.getElementById('set').onchange=render;render();</script></body></html>
