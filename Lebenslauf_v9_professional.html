<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerbungsstudio - Professioneller Lebenslauf Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr 400px;
            gap: 0;
            height: 100vh;
        }

        /* ===== LEFT SIDEBAR ===== */
        .sidebar {
            background: linear-gradient(135deg, #0f2855 0%, #1d4ed8 100%);
            color: white;
            padding: 40px 24px;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
        }

        .sidebar h1 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 32px;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-top: 8px;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255,255,255,0.7);
        }

        .step:hover {
            background: rgba(255,255,255,0.1);
        }

        .step.active {
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: 600;
        }

        .step-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step.active .step-number {
            background: white;
            color: #0f2855;
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            background: white;
            padding: 48px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1d4ed8;
        }

        .section-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-item label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Repeatable Sections */
        .repeatable-section {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .repeatable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .repeatable-title {
            font-size: 14px;
            font-weight: 600;
            color: #1d4ed8;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #d32f2f;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }

        .btn-remove:hover {
            color: #b71c1c;
        }

        .btn-add {
            background: none;
            border: 2px dashed #1d4ed8;
            color: #1d4ed8;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .btn-add:hover {
            background: #f0f4ff;
        }

        /* Competencies */
        .competency-search {
            position: relative;
        }

        .competency-input {
            width: 100%;
        }

        .competency-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #1d4ed8;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            transition: all 0.2s;
        }

        .suggestion-item:hover {
            background: #f0f4ff;
        }

        .competency-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .competency-tag {
            background: #1d4ed8;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .competency-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            display: flex;
        }

        /* Formatting Section */
        .formatting-section {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .formatting-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 16px;
        }

        .format-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .format-option {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .format-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .color-picker {
            display: flex;
            gap: 8px;
        }

        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #333;
        }

        .size-options {
            display: flex;
            gap: 8px;
        }

        .size-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }

        .size-btn:hover {
            border-color: #1d4ed8;
        }

        .size-btn.selected {
            background: #1d4ed8;
            color: white;
            border-color: #1d4ed8;
        }

        /* Button Navigation */
        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 2px solid #e0e0e0;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background: white;
            color: #1d4ed8;
            border: 2px solid #1d4ed8;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
        }

        .btn-primary {
            background: #1d4ed8;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #1e40af;
        }

        /* ===== RIGHT PREVIEW ===== */
        .preview {
            background: #f5f5f5;
            border-left: 1px solid #e0e0e0;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preview-header {
            font-size: 12px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cv-preview {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cv-content {
            padding: 20px;
            font-size: 11px;
            line-height: 1.5;
            flex: 1;
            overflow-y: auto;
        }

        .cv-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .cv-contact {
            font-size: 10px;
            color: #666;
            margin-bottom: 12px;
        }

        .cv-section {
            margin-bottom: 12px;
        }

        .cv-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid;
            margin-bottom: 6px;
            padding-bottom: 4px;
        }

        .cv-entry {
            margin-bottom: 6px;
        }

        .cv-entry-title {
            font-weight: 700;
            font-size: 11px;
        }

        .cv-entry-subtitle {
            font-size: 10px;
            color: #666;
            margin-top: 1px;
        }

        .cv-entry-text {
            font-size: 10px;
            margin-top: 2px;
        }

        .btn-download {
            background: #1d4ed8;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-download:hover {
            background: #1e40af;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar {
                display: none;
            }
            .preview {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <h1>Lebenslauf</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text"><span id="completionPercent">0</span>%</div>

            <div class="steps" id="stepsNav"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main" id="mainContent"></div>

        <!-- RIGHT PREVIEW -->
        <div class="preview">
            <div class="preview-header">Live-Vorschau</div>
            <div class="cv-preview">
                <div class="cv-content" id="cvPreview"></div>
            </div>
            <button class="btn-download" onclick="downloadPDF()">⬇ PDF</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        let currentStep = 0;
        let appState = {
            firstName: '',
            lastName: '',
            birthDate: '',
            street: '',
            city: '',
            postalCode: '',
            phone: '',
            email: '',
            experiences: [],
            educations: [],
            competencies: [],
            languages: [{ language: '', level: 'Muttersprache' }],
            signature: 'formal',
            color: '#000',
            size: 'A',
            alignment: 'left'
        };

        const competencyDatabase = [
            'Projektmanagement', 'Problemlösungskompetenz', 'Teamfähigkeit', 'Digitale Kommunikation',
            'Kundenservice', 'Führungskompetenz', 'Kreativität', 'Analytische Fähigkeiten',
            'Zeitmanagement', 'Konfliktlösung', 'Präsentationsfähigkeit', 'Verkaufstalent',
            'Selbstständigkeit', 'Organisationstalent', 'Zuverlässigkeit', 'Flexibilität'
        ];

        const steps = [
            { number: '0', title: 'Vorlage', subtitle: 'Lebenslauf' },
            { number: '1', title: 'Kontakt', subtitle: 'Deine Daten' },
            { number: '2', title: 'Erfahrung', subtitle: 'Beruflich' },
            { number: '3', title: 'Ausbildung', subtitle: 'Schulung' },
            { number: '4', title: 'Kompetenzen', subtitle: 'Fähigkeiten' },
            { number: '5', title: 'Sprachen', subtitle: 'Sprachen' },
            { number: '6', title: 'Finalisieren', subtitle: 'Formatierung' }
        ];

        // Generate Navigation
        function initializeNav() {
            const nav = document.getElementById('stepsNav');
            nav.innerHTML = steps.map((s, i) => `
                <div class="step ${i === 0 ? 'active' : ''}" onclick="goToStep(${i})">
                    <div class="step-number">${s.number}</div>
                    <div class="step-title">${s.title}</div>
                </div>
            `).join('');
        }

        // Generate Main Content
        function generateContent() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <!-- STEP 0: TEMPLATE -->
                <div class="section active" data-step="0">
                    <h2>Lebenslauf Vorlage</h2>
                    <p class="section-subtitle">Wähle eine moderne, professionelle Vorlage.</p>
                    <div style="padding: 20px; background: #f9f9f9; border-radius: 8px; text-align: center;">
                        <p style="color: #666;">Moderne Vorlage - Professionell & Clean</p>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="goToStep(1)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 1: CONTACT DATA -->
                <div class="section" data-step="1">
                    <h2>Kontaktinformationen</h2>
                    <p class="section-subtitle">Wie können dich Arbeitgeber erreichen?</p>
                    <div class="form-group">
                        <div class="form-row">
                            <div class="form-item">
                                <label>Vorname</label>
                                <input type="text" id="firstName" placeholder="z. B. Lisa" onchange="updatePreview(); saveState()">
                            </div>
                            <div class="form-item">
                                <label>Nachname</label>
                                <input type="text" id="lastName" placeholder="z. B. Bach" onchange="updatePreview(); saveState()">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>Geburtsdatum</label>
                                <input type="text" id="birthDate" placeholder="z. B. 01.05.1992" onchange="updatePreview(); saveState()">
                            </div>
                            <div class="form-item">
                                <label>Straße</label>
                                <input type="text" id="street" placeholder="z. B. Hauptstraße 42" onchange="updatePreview(); saveState()">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>Stadt</label>
                                <input type="text" id="city" placeholder="z. B. Berlin" onchange="updatePreview(); saveState()">
                            </div>
                            <div class="form-item">
                                <label>PLZ</label>
                                <input type="text" id="postalCode" placeholder="z. B. 10115" onchange="updatePreview(); saveState()">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>Telefon</label>
                                <input type="tel" id="phone" placeholder="+49 30 123456789" onchange="updatePreview(); saveState()">
                            </div>
                            <div class="form-item">
                                <label>E-Mail</label>
                                <input type="email" id="email" placeholder="name@example.com" onchange="updatePreview(); saveState()">
                            </div>
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(0)">Zurück</button>
                        <button class="btn btn-primary" onclick="goToStep(2)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 2: EXPERIENCE -->
                <div class="section" data-step="2">
                    <h2>Berufliche Erfahrung</h2>
                    <p class="section-subtitle">Beginne mit deiner aktuellsten Position.</p>
                    <div class="form-group" id="experienceContainer"></div>
                    <button class="btn-add" onclick="addExperience()">+ Weitere Position hinzufügen</button>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(1)">Zurück</button>
                        <button class="btn btn-primary" onclick="goToStep(3)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 3: EDUCATION -->
                <div class="section" data-step="3">
                    <h2>Ausbildung</h2>
                    <p class="section-subtitle">Deine schulische und berufliche Ausbildung.</p>
                    <div class="form-group" id="educationContainer"></div>
                    <button class="btn-add" onclick="addEducation()">+ Weitere Ausbildung hinzufügen</button>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(2)">Zurück</button>
                        <button class="btn btn-primary" onclick="goToStep(4)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 4: COMPETENCIES -->
                <div class="section" data-step="4">
                    <h2>Kompetenzen & Fähigkeiten</h2>
                    <p class="section-subtitle">Wähle 4-8 relevante Fähigkeiten für die Stelle aus.</p>
                    <div class="form-group">
                        <label>Kompetenzen hinzufügen</label>
                        <div class="competency-search">
                            <input type="text" class="competency-input" id="competencyInput" placeholder="z. B. Projektmanagement" onkeyup="filterCompetencies()" onclick="filterCompetencies()">
                            <div class="competency-suggestions" id="suggestions" style="display: none;"></div>
                        </div>
                        <div class="competency-list" id="competencyList"></div>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(3)">Zurück</button>
                        <button class="btn btn-primary" onclick="goToStep(5)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 5: LANGUAGES -->
                <div class="section" data-step="5">
                    <h2>Sprachkenntnisse</h2>
                    <p class="section-subtitle">Welche Sprachen sprichst du?</p>
                    <div class="form-group" id="languageContainer"></div>
                    <button class="btn-add" onclick="addLanguage()">+ Weitere Sprache hinzufügen</button>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(4)">Zurück</button>
                        <button class="btn btn-primary" onclick="goToStep(6)">Weiter</button>
                    </div>
                </div>

                <!-- STEP 6: FINALIZATION -->
                <div class="section" data-step="6">
                    <h2>Lebenslauf fertigstellen</h2>
                    <p class="section-subtitle">Passe Design und Formatierung an.</p>

                    <div class="formatting-section">
                        <div class="formatting-title">Design</div>
                        <div class="format-grid">
                            <div class="format-option">
                                <div class="format-label">Farbe</div>
                                <div class="color-picker">
                                    <div class="color-option selected" style="background: #000;" onclick="setColor(0)"></div>
                                    <div class="color-option" style="background: #1d4ed8;" onclick="setColor(1)"></div>
                                    <div class="color-option" style="background: #059669;" onclick="setColor(2)"></div>
                                </div>
                            </div>
                            <div class="format-option">
                                <div class="format-label">Größe</div>
                                <div class="size-options">
                                    <button class="size-btn selected" onclick="setSize('A')">A</button>
                                    <button class="size-btn" onclick="setSize('A+')">A+</button>
                                </div>
                            </div>
                            <div class="format-option">
                                <div class="format-label">Ausrichtung</div>
                                <div class="size-options">
                                    <button class="size-btn selected" onclick="setAlignment('left')">Links</button>
                                    <button class="size-btn" onclick="setAlignment('center')">Mitte</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Unterschriftstil</label>
                        <select id="signature" onchange="updatePreview(); saveState()">
                            <option value="formal">Formale Unterschrift</option>
                            <option value="casual">Lockere Unterschrift</option>
                            <option value="modern">Moderne Unterschrift</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(5)">Zurück</button>
                        <button class="btn btn-primary" onclick="downloadPDF()">📥 PDF Herunterladen</button>
                    </div>
                </div>
            `;
        }

        function goToStep(step) {
            currentStep = step;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.section[data-step="${step}"]`).classList.add('active');

            document.querySelectorAll('.step').forEach((s, i) => {
                s.classList.toggle('active', i === step);
            });

            saveState();
            updatePreview();
            document.querySelector('.main').scrollTop = 0;
        }

        function addExperience() {
            appState.experiences.push({ id: Date.now(), company: '', position: '', start: '', end: '', description: '' });
            renderExperiences();
        }

        function removeExperience(id) {
            appState.experiences = appState.experiences.filter(e => e.id !== id);
            renderExperiences();
            updatePreview();
            saveState();
        }

        function renderExperiences() {
            const container = document.getElementById('experienceContainer');
            container.innerHTML = appState.experiences.map(exp => `
                <div class="repeatable-section">
                    <div class="repeatable-header">
                        <div class="repeatable-title">${exp.position || 'Position'} ${exp.company ? `bei ${exp.company}` : ''}</div>
                        <button class="btn-remove" onclick="removeExperience(${exp.id})">×</button>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>Unternehmen</label>
                            <input type="text" placeholder="z. B. Google" value="${exp.company}" onchange="appState.experiences.find(e => e.id === ${exp.id}).company = this.value; renderExperiences(); updatePreview(); saveState()">
                        </div>
                        <div class="form-item">
                            <label>Position</label>
                            <input type="text" placeholder="z. B. Senior Manager" value="${exp.position}" onchange="appState.experiences.find(e => e.id === ${exp.id}).position = this.value; renderExperiences(); updatePreview(); saveState()">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>Start</label>
                            <input type="text" placeholder="z. B. 01.01.2020" value="${exp.start}" onchange="appState.experiences.find(e => e.id === ${exp.id}).start = this.value; updatePreview(); saveState()">
                        </div>
                        <div class="form-item">
                            <label>Ende</label>
                            <input type="text" placeholder="z. B. 31.12.2023" value="${exp.end}" onchange="appState.experiences.find(e => e.id === ${exp.id}).end = this.value; updatePreview(); saveState()">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>Beschreibung</label>
                        <textarea placeholder="Aufgaben und Erfolge..." onchange="appState.experiences.find(e => e.id === ${exp.id}).description = this.value; updatePreview(); saveState()">${exp.description}</textarea>
                    </div>
                </div>
            `).join('');
        }

        function addEducation() {
            appState.educations.push({ id: Date.now(), institution: '', degree: '', field: '', start: '', end: '' });
            renderEducations();
        }

        function removeEducation(id) {
            appState.educations = appState.educations.filter(e => e.id !== id);
            renderEducations();
            updatePreview();
            saveState();
        }

        function renderEducations() {
            const container = document.getElementById('educationContainer');
            container.innerHTML = appState.educations.map(edu => `
                <div class="repeatable-section">
                    <div class="repeatable-header">
                        <div class="repeatable-title">${edu.degree || 'Abschluss'} - ${edu.institution || 'Institution'}</div>
                        <button class="btn-remove" onclick="removeEducation(${edu.id})">×</button>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>Institution</label>
                            <input type="text" placeholder="z. B. Universität Berlin" value="${edu.institution}" onchange="appState.educations.find(e => e.id === ${edu.id}).institution = this.value; renderEducations(); updatePreview(); saveState()">
                        </div>
                        <div class="form-item">
                            <label>Abschluss</label>
                            <input type="text" placeholder="z. B. Master of Science" value="${edu.degree}" onchange="appState.educations.find(e => e.id === ${edu.id}).degree = this.value; renderEducations(); updatePreview(); saveState()">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>Fachrichtung</label>
                            <input type="text" placeholder="z. B. Informatik" value="${edu.field}" onchange="appState.educations.find(e => e.id === ${edu.id}).field = this.value; updatePreview(); saveState()">
                        </div>
                        <div class="form-item">
                            <label>Zeitraum</label>
                            <input type="text" placeholder="z. B. 2018 - 2020" value="${edu.start} ${edu.end}" onchange="const [s, e] = this.value.split('-').map(x => x.trim()); appState.educations.find(ed => ed.id === ${edu.id}).start = s; appState.educations.find(ed => ed.id === ${edu.id}).end = e; updatePreview(); saveState()">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCompetencies() {
            const input = document.getElementById('competencyInput').value.toLowerCase();
            const suggestions = document.getElementById('suggestions');

            if (!input) {
                suggestions.style.display = 'none';
                return;
            }

            const filtered = competencyDatabase.filter(c =>
                c.toLowerCase().includes(input) && !appState.competencies.includes(c)
            );

            if (filtered.length === 0) {
                suggestions.style.display = 'none';
                return;
            }

            suggestions.innerHTML = filtered.map(c => `
                <div class="suggestion-item" onclick="addCompetency('${c}')">${c}</div>
            `).join('');
            suggestions.style.display = 'block';
        }

        function addCompetency(competency) {
            if (!appState.competencies.includes(competency)) {
                appState.competencies.push(competency);
                renderCompetencies();
                updatePreview();
                saveState();
            }
            document.getElementById('competencyInput').value = '';
            document.getElementById('suggestions').style.display = 'none';
        }

        function removeCompetency(competency) {
            appState.competencies = appState.competencies.filter(c => c !== competency);
            renderCompetencies();
            updatePreview();
            saveState();
        }

        function renderCompetencies() {
            const list = document.getElementById('competencyList');
            list.innerHTML = appState.competencies.map(c => `
                <div class="competency-tag">
                    ${c}
                    <button onclick="removeCompetency('${c}')">×</button>
                </div>
            `).join('');
        }

        function addLanguage() {
            appState.languages.push({ language: '', level: 'Muttersprache' });
            renderLanguages();
        }

        function renderLanguages() {
            const container = document.getElementById('languageContainer');
            container.innerHTML = appState.languages.map((lang, i) => `
                <div class="form-row">
                    <select onchange="appState.languages[${i}].language = this.value; updatePreview(); saveState()" style="flex: 1;">
                        <option value="">Sprache wählen...</option>
                        <option value="Deutsch" ${lang.language === 'Deutsch' ? 'selected' : ''}>Deutsch</option>
                        <option value="Englisch" ${lang.language === 'Englisch' ? 'selected' : ''}>Englisch</option>
                        <option value="Französisch" ${lang.language === 'Französisch' ? 'selected' : ''}>Französisch</option>
                        <option value="Spanisch" ${lang.language === 'Spanisch' ? 'selected' : ''}>Spanisch</option>
                        <option value="Italienisch" ${lang.language === 'Italienisch' ? 'selected' : ''}>Italienisch</option>
                        <option value="Russisch" ${lang.language === 'Russisch' ? 'selected' : ''}>Russisch</option>
                        <option value="Chinesisch" ${lang.language === 'Chinesisch' ? 'selected' : ''}>Chinesisch</option>
                    </select>
                    <select onchange="appState.languages[${i}].level = this.value; updatePreview(); saveState()" style="flex: 1;">
                        <option ${lang.level === 'Anfänger' ? 'selected' : ''}>Anfänger</option>
                        <option ${lang.level === 'Grundkenntnisse' ? 'selected' : ''}>Grundkenntnisse</option>
                        <option ${lang.level === 'Fließend' ? 'selected' : ''}>Fließend</option>
                        <option ${lang.level === 'Muttersprache' ? 'selected' : ''}>Muttersprache</option>
                    </select>
                </div>
            `).join('');
        }

        function setColor(index) {
            const colors = ['#000', '#1d4ed8', '#059669'];
            appState.color = colors[index];
            document.querySelectorAll('.color-option').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            updatePreview();
            saveState();
        }

        function setSize(size) {
            appState.size = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.textContent === size);
            });
            updatePreview();
            saveState();
        }

        function setAlignment(alignment) {
            appState.alignment = alignment;
            updatePreview();
            saveState();
        }

        function updatePreview() {
            appState.firstName = document.getElementById('firstName')?.value || '';
            appState.lastName = document.getElementById('lastName')?.value || '';
            appState.phone = document.getElementById('phone')?.value || '';
            appState.email = document.getElementById('email')?.value || '';
            appState.city = document.getElementById('city')?.value || '';

            const name = `${appState.firstName} ${appState.lastName}`.trim() || 'Max Mustermann';
            const contact = [appState.email, appState.phone, appState.city].filter(Boolean).join(' • ') || 'max@example.com • Berlin';

            let html = `
                <div class="cv-name" style="color: ${appState.color};">${name}</div>
                <div class="cv-contact">${contact}</div>
            `;

            if (appState.experiences.length > 0) {
                html += `<div class="cv-section"><div class="cv-section-title" style="border-bottom-color: ${appState.color}; color: ${appState.color};">BERUFSERFAHRUNG</div>`;
                appState.experiences.forEach(exp => {
                    if (exp.company || exp.position) {
                        html += `<div class="cv-entry"><div class="cv-entry-title">${exp.position || 'Position'}</div><div class="cv-entry-subtitle">${exp.company}${exp.start ? ' (' + exp.start + (exp.end ? ' - ' + exp.end : '') + ')' : ''}</div>${exp.description ? '<div class="cv-entry-text">' + exp.description.substring(0, 100) + '</div>' : ''}</div>`;
                    }
                });
                html += '</div>';
            }

            if (appState.educations.length > 0) {
                html += `<div class="cv-section"><div class="cv-section-title" style="border-bottom-color: ${appState.color}; color: ${appState.color};">AUSBILDUNG</div>`;
                appState.educations.forEach(edu => {
                    if (edu.institution || edu.degree) {
                        html += `<div class="cv-entry"><div class="cv-entry-title">${edu.degree || 'Abschluss'}</div><div class="cv-entry-subtitle">${edu.institution}${edu.field ? ', ' + edu.field : ''}</div></div>`;
                    }
                });
                html += '</div>';
            }

            if (appState.competencies.length > 0) {
                html += `<div class="cv-section"><div class="cv-section-title" style="border-bottom-color: ${appState.color}; color: ${appState.color};">KOMPETENZEN</div><div class="cv-entry-text">${appState.competencies.join(', ')}</div></div>`;
            }

            if (appState.languages.filter(l => l.language).length > 0) {
                html += `<div class="cv-section"><div class="cv-section-title" style="border-bottom-color: ${appState.color}; color: ${appState.color};">SPRACHEN</div>`;
                appState.languages.filter(l => l.language).forEach(lang => {
                    html += `<div class="cv-entry"><div class="cv-entry-title">${lang.language}</div><div class="cv-entry-subtitle">${lang.level}</div></div>`;
                });
                html += '</div>';
            }

            document.getElementById('cvPreview').innerHTML = html;
            updateCompletion();
        }

        function updateCompletion() {
            let completion = 0;
            if (appState.firstName) completion += 8;
            if (appState.lastName) completion += 8;
            if (appState.email) completion += 8;
            if (appState.phone) completion += 8;
            if (appState.city) completion += 8;
            if (appState.experiences.length > 0) completion += 20;
            if (appState.educations.length > 0) completion += 15;
            if (appState.competencies.length > 0) completion += 10;
            if (appState.languages.filter(l => l.language).length > 0) completion += 7;

            document.getElementById('progressFill').style.width = completion + '%';
            document.getElementById('completionPercent').textContent = completion;
        }

        function saveState() {
            localStorage.setItem('cvState', JSON.stringify(appState));
        }

        function loadState() {
            const saved = localStorage.getItem('cvState');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                    if (appState.firstName) document.getElementById('firstName').value = appState.firstName;
                    if (appState.lastName) document.getElementById('lastName').value = appState.lastName;
                    if (appState.email) document.getElementById('email').value = appState.email;
                    if (appState.phone) document.getElementById('phone').value = appState.phone;
                    if (appState.city) document.getElementById('city').value = appState.city;
                    if (appState.street) document.getElementById('street').value = appState.street;
                    if (appState.postalCode) document.getElementById('postalCode').value = appState.postalCode;
                    if (appState.birthDate) document.getElementById('birthDate').value = appState.birthDate;

                    if (appState.experiences.length > 0) renderExperiences();
                    if (appState.educations.length > 0) renderEducations();
                    if (appState.competencies.length > 0) renderCompetencies();
                    if (appState.languages.length > 0) renderLanguages();
                } catch (e) {
                    console.error('Error loading state:', e);
                }
            }
        }

        function downloadPDF() {
            const element = document.getElementById('cvPreview');
            const filename = `${appState.firstName || 'Lebenslauf'}_${appState.lastName || ''}.pdf`.trim();
            const opt = {
                margin: 10,
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Initialize
        initializeNav();
        generateContent();
        loadState();
        updatePreview();
    </script>
</body>
</html>
