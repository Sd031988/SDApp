<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerbungsstudio - Lebenslauf</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --secondary: #10B981;
            --border: #E5E7EB;
            --text: #1F2937;
            --text-light: #6B7280;
            --light: #F9FAFB;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--text);
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: 100vh;
            gap: 0;
        }

        /* LEFT SIDEBAR */
        .sidebar-left {
            background: white;
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .nav-steps {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-step {
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
            padding-left: 0.75rem;
            transition: all 0.2s;
        }

        .nav-step:hover {
            background: var(--light);
        }

        .nav-step.active {
            background: #EBF5FF;
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        /* MAIN CONTENT */
        .main-content {
            background: white;
            overflow-y: auto;
            padding: 2rem;
        }

        .content-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
        }

        .form-section {
            background: white;
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input, textarea, select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .item {
            background: var(--light);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            position: relative;
        }

        .item-delete {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #EF4444;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        .add-btn, .btn-next, .btn-prev {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .add-btn {
            background: var(--secondary);
            color: white;
            width: 100%;
            margin-top: 1rem;
        }

        .add-btn:hover {
            background: #059669;
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:hover {
            background: #1D4ED8;
        }

        .btn-prev {
            background: var(--light);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* RIGHT SIDEBAR - PREVIEW */
        .sidebar-right {
            background: white;
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            font-size: 0.875rem;
        }

        .preview-title {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .preview-section {
            margin-bottom: 1.5rem;
        }

        .preview-section-title {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--primary);
            padding-bottom: 0.5rem;
        }

        .preview-text {
            font-size: 0.8rem;
            line-height: 1.5;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 280px 1fr;
            }
            .sidebar-right {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar-left {
                display: none;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar-left">
            <div class="sidebar-title">Lebenslauf</div>
            <div class="nav-steps" id="navSteps"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="content-title" id="stepTitle">Persönliche Daten</div>

            <!-- Step 0: Personal Data -->
            <div class="step-section active" data-step="0">
                <div class="form-section">
                    <div class="form-section-title">Grundinformationen</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Vorname</label>
                            <input type="text" id="vorname" placeholder="Max">
                        </div>
                        <div class="form-group">
                            <label>Nachname</label>
                            <input type="text" id="nachname" placeholder="Mustermann">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>E-Mail</label>
                            <input type="email" id="email" placeholder="max@beispiel.de">
                        </div>
                        <div class="form-group">
                            <label>Telefon</label>
                            <input type="tel" id="telefon" placeholder="+49 123 456789">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>Stadt</label>
                            <input type="text" id="stadt" placeholder="Berlin">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 1: Experience -->
            <div class="step-section" data-step="1">
                <div class="form-section">
                    <div class="form-section-title">Berufliche Erfahrung</div>
                    <div class="item-list" id="experienceList"></div>
                    <button class="add-btn" onclick="addExperience()">+ Position hinzufügen</button>
                </div>
            </div>

            <!-- Step 2: Education -->
            <div class="step-section" data-step="2">
                <div class="form-section">
                    <div class="form-section-title">Ausbildung</div>
                    <div class="item-list" id="educationList"></div>
                    <button class="add-btn" onclick="addEducation()">+ Ausbildung hinzufügen</button>
                </div>
            </div>

            <!-- Step 3: Skills -->
            <div class="step-section" data-step="3">
                <div class="form-section">
                    <div class="form-section-title">Fähigkeiten</div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>Sprachen</label>
                            <textarea id="languages" placeholder="z.B. Deutsch (Muttersprache), Englisch (Fließend)"></textarea>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>Technische Fähigkeiten</label>
                            <textarea id="technicalSkills" placeholder="z.B. JavaScript, Python, HTML/CSS"></textarea>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>Soft Skills</label>
                            <textarea id="softSkills" placeholder="z.B. Teamfähigkeit, Kommunikation, Problemlösung"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 4: Download -->
            <div class="step-section" data-step="4">
                <div class="form-section">
                    <div class="form-section-title">Lebenslauf exportieren</div>
                    <p style="margin-bottom: 1rem; color: var(--text-light);">Ihr Lebenslauf ist fertig. Wählen Sie das Format zum Herunterladen.</p>
                    <div class="form-row">
                        <button class="btn-next" onclick="downloadPDF()" style="width: 100%;">📄 Als PDF herunterladen</button>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-prev" id="prevBtn" onclick="previousStep()" style="display: none;">← Zurück</button>
                <button class="btn-next" id="nextBtn" onclick="nextStep()">Weiter →</button>
            </div>
        </div>

        <!-- RIGHT SIDEBAR - PREVIEW -->
        <div class="sidebar-right">
            <div class="preview-title">Lebenslauf Vorschau</div>
            <div id="preview" class="preview-text"></div>
        </div>
    </div>

    <script>
        const state = {
            currentStep: 0,
            personalData: {
                vorname: '',
                nachname: '',
                email: '',
                telefon: '',
                stadt: ''
            },
            experiences: [],
            educations: [],
            languages: '',
            technicalSkills: '',
            softSkills: ''
        };

        const steps = [
            'Persönliche Daten',
            'Berufliche Erfahrung',
            'Ausbildung',
            'Fähigkeiten',
            'Export'
        ];

        function init() {
            renderNav();
            attachInputListeners();
            showStep(0);
            updatePreview();
        }

        function renderNav() {
            const nav = document.getElementById('navSteps');
            nav.innerHTML = '';
            steps.forEach((title, idx) => {
                const btn = document.createElement('div');
                btn.className = 'nav-step';
                if (idx === state.currentStep) btn.classList.add('active');
                btn.textContent = title;
                btn.onclick = () => goToStep(idx);
                nav.appendChild(btn);
            });
        }

        function attachInputListeners() {
            ['vorname', 'nachname', 'email', 'telefon', 'stadt'].forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => {
                    state.personalData[id] = e.target.value;
                    updatePreview();
                    saveState();
                });
            });

            ['languages', 'technicalSkills', 'softSkills'].forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => {
                    state[id] = e.target.value;
                    updatePreview();
                    saveState();
                });
            });
        }

        function showStep(stepIdx) {
            document.querySelectorAll('.step-section').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`[data-step="${stepIdx}"]`).classList.add('active');

            document.getElementById('stepTitle').textContent = steps[stepIdx];
            document.getElementById('prevBtn').style.display = stepIdx > 0 ? 'block' : 'none';
            document.getElementById('nextBtn').textContent = stepIdx === steps.length - 1 ? 'Fertig' : 'Weiter →';

            renderNav();

            if (stepIdx === 1) renderExperienceList();
            if (stepIdx === 2) renderEducationList();
        }

        function goToStep(idx) {
            state.currentStep = idx;
            showStep(idx);
        }

        function nextStep() {
            if (state.currentStep < steps.length - 1) {
                state.currentStep++;
                showStep(state.currentStep);
                saveState();
            } else {
                downloadPDF();
            }
        }

        function previousStep() {
            if (state.currentStep > 0) {
                state.currentStep--;
                showStep(state.currentStep);
            }
        }

        function addExperience() {
            state.experiences.push({
                job: '',
                company: '',
                startDate: '',
                endDate: ''
            });
            renderExperienceList();
            saveState();
        }

        function removeExperience(idx) {
            state.experiences.splice(idx, 1);
            renderExperienceList();
            saveState();
            updatePreview();
        }

        function renderExperienceList() {
            const list = document.getElementById('experienceList');
            list.innerHTML = '';
            state.experiences.forEach((exp, idx) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <button class="item-delete" onclick="removeExperience(${idx})">✕</button>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Jobtitel</label>
                            <input type="text" value="${exp.job}"
                                onchange="state.experiences[${idx}].job = this.value; updatePreview(); saveState();">
                        </div>
                        <div class="form-group">
                            <label>Unternehmen</label>
                            <input type="text" value="${exp.company}"
                                onchange="state.experiences[${idx}].company = this.value; updatePreview(); saveState();">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Von</label>
                            <input type="date" value="${exp.startDate}"
                                onchange="state.experiences[${idx}].startDate = this.value; updatePreview(); saveState();">
                        </div>
                        <div class="form-group">
                            <label>Bis</label>
                            <input type="date" value="${exp.endDate}"
                                onchange="state.experiences[${idx}].endDate = this.value; updatePreview(); saveState();">
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function addEducation() {
            state.educations.push({
                school: '',
                field: '',
                startDate: '',
                endDate: ''
            });
            renderEducationList();
            saveState();
        }

        function removeEducation(idx) {
            state.educations.splice(idx, 1);
            renderEducationList();
            saveState();
            updatePreview();
        }

        function renderEducationList() {
            const list = document.getElementById('educationList');
            list.innerHTML = '';
            state.educations.forEach((edu, idx) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <button class="item-delete" onclick="removeEducation(${idx})">✕</button>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Schule/Universität</label>
                            <input type="text" value="${edu.school}"
                                onchange="state.educations[${idx}].school = this.value; updatePreview(); saveState();">
                        </div>
                        <div class="form-group">
                            <label>Studienfeld</label>
                            <input type="text" value="${edu.field}"
                                onchange="state.educations[${idx}].field = this.value; updatePreview(); saveState();">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Von</label>
                            <input type="date" value="${edu.startDate}"
                                onchange="state.educations[${idx}].startDate = this.value; updatePreview(); saveState();">
                        </div>
                        <div class="form-group">
                            <label>Bis</label>
                            <input type="date" value="${edu.endDate}"
                                onchange="state.educations[${idx}].endDate = this.value; updatePreview(); saveState();">
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updatePreview() {
            const name = `${state.personalData.vorname} ${state.personalData.nachname}`.trim() || 'Name';
            const contact = [state.personalData.email, state.personalData.telefon, state.personalData.stadt].filter(x => x).join(' • ') || 'Kontakt';

            let html = `
                <div class="preview-section">
                    <div style="font-weight: 700; font-size: 1rem;">${name}</div>
                    <div style="color: var(--text-light); font-size: 0.8rem;">${contact}</div>
                </div>
            `;

            if (state.experiences.length > 0) {
                html += '<div class="preview-section"><div class="preview-section-title">Erfahrung</div>';
                state.experiences.forEach(exp => {
                    html += `<div style="margin-bottom: 0.5rem;"><strong>${exp.job}</strong><br><span style="color: var(--text-light);">${exp.company}</span></div>`;
                });
                html += '</div>';
            }

            if (state.educations.length > 0) {
                html += '<div class="preview-section"><div class="preview-section-title">Ausbildung</div>';
                state.educations.forEach(edu => {
                    html += `<div style="margin-bottom: 0.5rem;"><strong>${edu.field}</strong><br><span style="color: var(--text-light);">${edu.school}</span></div>`;
                });
                html += '</div>';
            }

            if (state.languages) {
                html += `<div class="preview-section"><div class="preview-section-title">Sprachen</div><div>${state.languages}</div></div>`;
            }

            document.getElementById('preview').innerHTML = html;
        }

        function downloadPDF() {
            const name = `${state.personalData.vorname} ${state.personalData.nachname}`.trim() || 'Lebenslauf';
            let content = `${name}\n`;
            content += `${state.personalData.email} | ${state.personalData.telefon} | ${state.personalData.stadt}\n\n`;

            if (state.experiences.length > 0) {
                content += `BERUFLICHE ERFAHRUNG\n`;
                state.experiences.forEach(exp => {
                    content += `${exp.job} - ${exp.company} (${exp.startDate} - ${exp.endDate})\n`;
                });
                content += '\n';
            }

            if (state.educations.length > 0) {
                content += `AUSBILDUNG\n`;
                state.educations.forEach(edu => {
                    content += `${edu.field} - ${edu.school} (${edu.startDate} - ${edu.endDate})\n`;
                });
                content += '\n';
            }

            if (state.languages) content += `SPRACHEN\n${state.languages}\n\n`;
            if (state.technicalSkills) content += `TECHNISCHE FÄHIGKEITEN\n${state.technicalSkills}\n\n`;
            if (state.softSkills) content += `SOFT SKILLS\n${state.softSkills}\n`;

            const element = document.createElement('div');
            element.innerHTML = content.replace(/\n/g, '<br>');

            const opt = {
                margin: 10,
                filename: `${name}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function saveState() {
            localStorage.setItem('lebenslaueState', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('lebenslaueState');
            if (saved) {
                Object.assign(state, JSON.parse(saved));
                document.getElementById('vorname').value = state.personalData.vorname;
                document.getElementById('nachname').value = state.personalData.nachname;
                document.getElementById('email').value = state.personalData.email;
                document.getElementById('telefon').value = state.personalData.telefon;
                document.getElementById('stadt').value = state.personalData.stadt;
                document.getElementById('languages').value = state.languages;
                document.getElementById('technicalSkills').value = state.technicalSkills;
                document.getElementById('softSkills').value = state.softSkills;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            init();
        });
    </script>
</body>
</html>
