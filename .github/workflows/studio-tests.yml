name: SD Studio – automatische Prüfungen
on:
  push:
    paths:
      - 'studio/**'
      - 'tests/studio/**'
      - '.github/workflows/studio-tests.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'tests/studio/**'
      - '.github/workflows/studio-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript-Syntax prüfen
        run: |
          node --check studio/studio.js
          node --check studio/ki-werkstatt-core.js
          node --check studio/ki-werkstatt-ui.js
          node --check studio/studio-diagnose.js
          node --check studio/studio-qualitaet.js
      - name: Projektanalyse und Export prüfen
        run: node --test tests/studio/studio.test.cjs tests/studio/ki-werkstatt.test.cjs tests/studio/studio-diagnose.test.cjs tests/studio/qualitaet.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser-Testwerkzeug installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Studio im Browser testen
        run: node tests/studio/browser.test.cjs
