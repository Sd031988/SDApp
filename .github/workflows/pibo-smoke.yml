name: Pibo smoke checks
on:
  push:
    paths:
      - 'kids/**'
      - '.github/workflows/pibo-smoke.yml'
  pull_request:
    paths:
      - 'kids/**'
      - '.github/workflows/pibo-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pibo modules
        run: |
          node --check kids/pibo-care.js
          node --check kids/pibo-audio.js
          node --check kids/pibo-premium.js
          node --check kids/pibo-smoke.js
          node --check kids/pibo-rewards.mjs
          node --check kids/pibo-face.mjs
          node --check kids/pibo-motion.mjs
          node --check kids/pibo-voice.mjs
          node --check kids/pibo-character.mjs
          node --check kids/pibo-interactions.mjs
      - name: Verify local star rewards and daily limits
        run: node kids/pibo-rewards.test.mjs
      - name: Verify facial animations
        run: node kids/pibo-face.test.mjs
      - name: Verify body motion and transitions
        run: node kids/pibo-motion.test.mjs
      - name: Verify speech, character design and direct care gestures
        run: |
          node kids/pibo-voice.test.mjs
          node kids/pibo-character.test.mjs
          node kids/pibo-interactions.test.mjs
      - name: Verify BlockWorld sandbox and game logic
        run: |
          node --check kids/blockworld/core.mjs
          node --check kids/blockworld/game.mjs
          node kids/blockworld/core.test.mjs
          node --check kids/blockworld/online.mjs
          node kids/blockworld/online.test.mjs
      - name: Verify original sound library, volume, mute and all game cues
        run: |
          node --check kids/sd-sound.mjs
          node --check kids/sd-sound.test.mjs
          node kids/sd-sound.test.mjs
          node kids/pibo-audio.test.mjs
          node kids/pibo-premium.test.mjs
      - name: Verify SD Kids eight mini-game engines and ten-game catalog
        run: |
          node --check kids/games/catalog.mjs
          node --check kids/games/rules.mjs
          node --check kids/games/play.mjs
          node kids/games/rules.test.mjs
          node --check kids/games/profile.mjs
          node kids/games/profile.test.mjs
          node --check kids/games/sw.js
          node -e "const m=JSON.parse(require('fs').readFileSync('kids/games/manifest.webmanifest','utf8')); if(!m.name||!m.start_url) process.exit(1)"
      - name: Exercise rooms, feeding, bath, sleep, toilet and games
        run: node kids/pibo-smoke-test.mjs
