name: Pibo smoke checks
on:
  push:
    paths:
      - 'kids/**'
      - '.github/workflows/pibo-smoke.yml'
  pull_request:
    paths:
      - 'kids/**'
      - '.github/workflows/pibo-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pibo modules
        run: |
          node --check kids/pibo-care.js
          node --check kids/pibo-audio.js
          node --check kids/pibo-smoke.js
          node --check kids/pibo-rewards.mjs
          node --check kids/pibo-face.mjs
          node --check kids/pibo-motion.mjs
      - name: Verify local star rewards and daily limits
        run: node kids/pibo-rewards.test.mjs
      - name: Verify facial animations
        run: node kids/pibo-face.test.mjs
      - name: Verify body motion and transitions
        run: node kids/pibo-motion.test.mjs
      - name: Verify BlockWorld sandbox and game logic
        run: |
          node --check kids/blockworld/core.mjs
          node --check kids/blockworld/game.mjs
          node kids/blockworld/core.test.mjs
      - name: Exercise rooms, feeding, bath, sleep, toilet and games
        run: node kids/pibo-smoke-test.mjs
