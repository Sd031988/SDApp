name: Nordhafen Spiel-Skript und Szenen-Test
on:
  pull_request:
    paths:
      - 'studio/game-studio/engine/spiele/nordhafen.js'
      - 'studio/game-studio/engine/szenen/nordhafen.json'
      - 'studio/game-studio/engine/nordhafen.test.cjs'
      - 'studio/game-studio/engine/nordhafen-ops-*'
      - 'tests/studio/nordhafen-ops-browser.test.cjs'
      - 'tests/studio/nordhafen-ops-physics.test.cjs'
      - 'tests/studio/nordhafen-ops-perf.cjs'
      - 'studio/game-studio/engine/sd-taktik-bewegung.js'
      - 'studio/game-studio/engine/sd-taktik-bewegung.test.cjs'
      - 'studio/game-studio/engine/sd-engine.js'
      - 'studio/game-studio/engine/index.html'
      - 'studio/game-studio/engine/sd-mensch.js'
      - 'tests/studio/nordhafen-taktik-browser.test.cjs'
      - 'studio/game-studio/engine/sd-bauplan-pakete.js'
      - 'studio/game-studio/engine/sd-szene.js'
      - '.github/workflows/nordhafen-test.yml'
  workflow_dispatch:
jobs:
  nordhafen-smoke:
    runs-on: ubuntu-24.04  # Playwright 1.56 kennt ubuntu-latest (26.04) noch nicht
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Nordhafen Editor-Map und Spielskript testen
        run: node --test studio/game-studio/engine/nordhafen.test.cjs studio/game-studio/engine/sd-taktik-bewegung.test.cjs
      - name: Havok-Fahrphysik (echtes Havok-WASM in Node) testen
        run: |
          npm install --no-save --no-package-lock babylonjs @babylonjs/havok
          node --test tests/studio/nordhafen-ops-physics.test.cjs

  nordhafen-browser:
    runs-on: ubuntu-24.04  # Playwright 1.56 kennt ubuntu-latest (26.04) noch nicht
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium mit Software-WebGL installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Babylon / Havok Nordhafen Steuerung im Browser testen
        run: node tests/studio/nordhafen-taktik-browser.test.cjs
      - name: Nordhafen Ops große Stadt und Autosteuerung in Chromium testen
        if: always()
        run: node tests/studio/nordhafen-ops-browser.test.cjs
      - name: Nordhafen Ops FPS messen (SwiftShader, nur Vergleichswert)
        if: always()
        continue-on-error: true
        env:
          NORDHAFEN_PERF_OUT: game-studio-workspace-artifacts/nordhafen-ops-perf.json
        run: |
          mkdir -p game-studio-workspace-artifacts
          node tests/studio/nordhafen-ops-perf.cjs
      - name: FPS-Messung archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordhafen-ops-perf
          path: game-studio-workspace-artifacts/nordhafen-ops-perf.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Desktop- und Mobil-Screenshots archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordhafen-taktik-browser-screenshots
          path: game-studio-workspace-artifacts/nordhafen-taktik-*.png
          if-no-files-found: ignore
          retention-days: 14
