name: One-time merged branch cleanup
on:
  pull_request:
    paths:
      - ".github/workflows/branch-cleanup-2026-11-11.yml"
      - ".github/branch-cleanup-2026-11-11.json"
      - "scripts/cleanup-merged-branches-2026-11-11.cjs"
      - "tests/cleanup-merged-branches.test.cjs"
  push:
    branches: [main]
    paths:
      - ".github/branch-cleanup-2026-11-11.json"
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: merged-branch-cleanup-2026-11-11
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Safety regression tests
        run: node --test tests/cleanup-merged-branches.test.cjs
      - name: Read-only branch audit
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./scripts/cleanup-merged-branches-2026-11-11.cjs');
            await cleanup({github, context, core, dryRun: true});
  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Sd031988/SDApp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Safety regression tests
        run: node --test tests/cleanup-merged-branches.test.cjs
      - name: Delete only branches fully contained in current main
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./scripts/cleanup-merged-branches-2026-11-11.cjs');
            await cleanup({github, context, core, dryRun: false});
