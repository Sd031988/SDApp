name: Deutsch-Lernweg Browserchecks
on:
  push:
    branches: [feature/b1-pruefung]
    paths:
      - 'deutsch/**'
      - 'tests/lernweg.spec.js'
      - '.github/workflows/lernweg-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sdhub-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/deutsch/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sdhub-http.log
          exit 1
      - name: Run navigation regression tests
        run: npx playwright test tests/lernweg.spec.js --browser=chromium --workers=1 --reporter=line
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lernweg-test-results
          path: test-results/
          if-no-files-found: ignore
