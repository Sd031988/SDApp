name: Feedback security tests
on:
  pull_request:
    paths:
      - 'feedback-server/**'
      - 'tests/feedback-*.test.cjs'
      - '.github/workflows/feedback-security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/feedback-*.test.cjs
