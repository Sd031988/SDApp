name: Mein SD Hub Quality
on:
  push:
    branches: [main]
    paths:
      - "mein-sd-hub/**"
      - "tests/mein-sd-hub*.cjs"
      - "tests/hub-homepage*.cjs"
      - "tests/hub/**"
      - "tests/play-separation*.cjs"
      - "play/**"
      - "kids/index.html"
      - "kids/games/index.html"
      - "kids/blockworld/index.html"
      - "index.html"
      - ".github/workflows/mein-sd-hub-quality.yml"
  pull_request:
    paths:
      - "mein-sd-hub/**"
      - "tests/mein-sd-hub*.cjs"
      - "tests/hub-homepage*.cjs"
      - "tests/hub/**"
      - "tests/play-separation*.cjs"
      - "play/**"
      - "kids/index.html"
      - "kids/games/index.html"
      - "kids/blockworld/index.html"
      - "index.html"
      - ".github/workflows/mein-sd-hub-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Functional and browser checks
    runs-on: ubuntu-24.04  # Playwright 1.56 kennt ubuntu-latest (26.04) noch nicht
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate course, routes, links and state
        run: |
          node tests/mein-sd-hub.test.cjs
          node --test tests/hub-homepage.test.cjs tests/play-separation.test.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser journey
        run: |
          node tests/mein-sd-hub.browser.cjs
          node tests/hub-homepage.browser.cjs
          node tests/hub/dashboard.browser.cjs
          node tests/play-separation.browser.cjs
