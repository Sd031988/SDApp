name: Vendor pinned Python runtime for PR 179
on:
  pull_request:
    paths: ['.github/workflows/python-vendor-bootstrap.yml']
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == 'Sd031988/SDApp' && github.event.pull_request.number == 179 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/python-pyodide-machbarkeit-freigabe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact upstream core and verify all five files
        run: |
          curl -fL --retry 2 https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2 -o /tmp/python-core.tar.bz2
          mkdir -p /tmp/python-core
          tar -xjf /tmp/python-core.tar.bz2 -C /tmp/python-core pyodide/pyodide.mjs pyodide/pyodide.asm.mjs pyodide/pyodide.asm.wasm pyodide/python_stdlib.zip pyodide/pyodide-lock.json
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const dest='studio/vendor/pyodide/314.0.7/';
          const manifest=JSON.parse(fs.readFileSync(dest+'manifest.json'));
          for(const [name,entry] of Object.entries(manifest.files)){
            const bytes=fs.readFileSync('/tmp/python-core/pyodide/'+name);
            if(bytes.length!==entry.bytes||crypto.createHash('sha256').update(bytes).digest('hex')!==entry.sha256)throw Error('Checksum mismatch: '+name);
            fs.writeFileSync(dest+name,bytes);
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f studio/vendor/pyodide/314.0.7/pyodide.mjs studio/vendor/pyodide/314.0.7/pyodide.asm.mjs studio/vendor/pyodide/314.0.7/pyodide.asm.wasm studio/vendor/pyodide/314.0.7/python_stdlib.zip studio/vendor/pyodide/314.0.7/pyodide-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor verified Pyodide 314.0.7 core assets'
            git push origin HEAD:docs/python-pyodide-machbarkeit-freigabe
          fi
