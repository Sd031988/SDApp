<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Kids – Pibo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#27304d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e8f5ff,#fff1e5);display:grid;place-items:center}.game{width:min(94vw,620px);padding:24px;border-radius:30px;background:#ffffffd9;box-shadow:0 18px 55px #68739c2c;text-align:center}h1{margin:0 0 6px}.hint{color:#68718b}.room{position:relative;min-height:290px;border-radius:25px;background:linear-gradient(#d8eaff 72%,#f6dbb8 72%);display:grid;place-items:center;overflow:hidden}.cat{font-size:150px;cursor:pointer;user-select:none;transition:transform .25s;filter:drop-shadow(0 12px 5px #8c7d7855)}.cat:active{transform:scale(1.13) rotate(-5deg)}.cat.bounce{animation:bounce .5s ease}@keyframes bounce{50%{transform:translateY(-28px) rotate(7deg)}}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.stat{text-align:left;font-size:14px}.stat progress{display:block;width:100%;height:16px;accent-color:#5d93f2}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px;cursor:pointer;background:#dce9ff;color:#273b6a}button:hover,button:focus-visible{background:#bcd6ff;outline:2px solid #7196d7}#message{min-height:24px;font-weight:600}@media(min-width:520px){.actions{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="game"><h1>🐾 SD Kids – Pibo</h1><p class="hint">Dein kleiner Katzenfreund</p><div class="room"><div class="cat" id="cat" role="button" tabindex="0" aria-label="Pibo streicheln">🐱</div></div><p id="message" role="status" aria-live="polite">Hallo! Ich bin Pibo! 💙</p><section class="stats" aria-label="Pibos Bedürfnisse"><div class="stat">🍎 Satt <progress id="food" max="100"></progress></div><div class="stat">💙 Freude <progress id="joy" max="100"></progress></div><div class="stat">💤 Energie <progress id="energy" max="100"></progress></div><div class="stat">🧼 Sauber <progress id="clean" max="100"></progress></div></section><div class="actions"><button data-action="feed">🍎 Füttern</button><button data-action="play">🧶 Spielen</button><button data-action="sleep">💤 Schlafen</button><button data-action="wash">🫧 Waschen</button></div><p class="hint">Dein Spielstand bleibt auf diesem Gerät gespeichert.</p></main>
<script>
(()=>{'use strict';const key='sd-kids-pibo-v1',defaults={food:75,joy:80,energy:70,clean:85};let stats={...defaults};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object')for(const k of Object.keys(defaults))if(Number.isFinite(saved[k]))stats[k]=Math.max(0,Math.min(100,saved[k]));}catch{}const cat=document.getElementById('cat'),msg=document.getElementById('message');function render(){for(const k of Object.keys(defaults))document.getElementById(k).value=stats[k];try{localStorage.setItem(key,JSON.stringify(stats))}catch{}}function change(values,message){for(const [k,v] of Object.entries(values))stats[k]=Math.max(0,Math.min(100,stats[k]+v));msg.textContent=message;cat.classList.remove('bounce');void cat.offsetWidth;cat.classList.add('bounce');render()}const actions={feed:()=>change({food:20,clean:-4},'Miau! Das war lecker! 🍎'),play:()=>change({joy:20,energy:-12,food:-7,clean:-5},'Juhu! Noch eine Runde! 🧶'),sleep:()=>change({energy:30,food:-6},'Pibo hat schön geschlafen! 💤'),wash:()=>change({clean:25,joy:-3},'Jetzt bin ich wieder sauber! 🫧')};document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.action]()));function pet(){change({joy:8},'Prrrr… Pibo liebt Streicheleinheiten! 💙')}cat.addEventListener('click',pet);cat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});render()})();
</script></body></html>
