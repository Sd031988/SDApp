<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SD Kids – Pibo die Katze</title><style>
:root{font-family:system-ui,sans-serif;color:#29324c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#fff0d9,#e7dcff 60%,#d9f6ee);text-align:center}header{padding:16px}header a{color:#374568}h1{font-size:clamp(2rem,6vw,3.4rem);margin:14px 0 4px}.wrap{max-width:700px;margin:auto;padding:12px 18px 38px}.panel{background:#ffffffcc;border:2px solid white;border-radius:30px;padding:22px;box-shadow:0 15px 40px #68598b22}.cat{font-size:clamp(125px,28vw,200px);display:block;cursor:pointer;user-select:none;transition:transform .18s;filter:drop-shadow(0 14px 6px #927b9d33)}.cat:active,.cat.happy{transform:scale(1.12) rotate(-5deg)}.bubble{min-height:52px;font-size:1.25rem;font-weight:700}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}button{font:inherit;border:0;border-radius:18px;background:#fff;color:#27324c;padding:16px 12px;font-weight:750;cursor:pointer;box-shadow:0 5px 0 #d5cde6}button:focus-visible{outline:4px solid #6b56c8}button:active{transform:translateY(3px);box-shadow:0 2px 0 #d5cde6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}.stats label{font-size:.85rem;font-weight:700}.track{height:12px;background:#e5e0eb;border-radius:30px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#9d7be5;width:70%;transition:width .25s}.note{font-size:.86rem;color:#5a6075;margin-top:18px}.back{display:inline-block;margin:14px} @media(max-width:400px){.panel{padding:14px}.actions button{padding:13px 6px}}
</style></head><body><header><a href="../index.html">← Zurück zum SD Hub</a><h1>🐾 SD Kids</h1><p>Spiel mit Pibo, deiner kleinen Katze!</p></header><main class="wrap"><section class="panel" aria-label="Pibo das Katzenspiel"><div class="stats"><div><label for="food">🍎 Satt</label><div class="track" id="food"><div class="fill"></div></div></div><div><label for="joy">💗 Freude</label><div class="track" id="joy"><div class="fill"></div></div></div><div><label for="energy">⚡ Energie</label><div class="track" id="energy"><div class="fill"></div></div></div></div><div id="cat" class="cat" role="button" tabindex="0" aria-label="Pibo streicheln">🐱</div><div class="bubble" id="say" aria-live="polite">Miau! Schön, dass du da bist! 💕</div><div class="actions"><button data-act="pet">🤗 Streicheln</button><button data-act="feed">🥛 Füttern</button><button data-act="play">🧶 Spielen</button><button data-act="sleep">🌙 Schlafen</button></div><p class="note">Ohne Werbung · Ohne Käufe · Keine Anmeldung · Spielstand nur auf diesem Gerät</p></section></main><script>
(()=>{'use strict';const key='sd-kids-pibo-v1';const initial={food:70,joy:75,energy:70};let state={...initial};try{const x=JSON.parse(localStorage.getItem(key));if(x&&typeof x==='object')for(const k of Object.keys(initial))if(Number.isFinite(x[k]))state[k]=Math.max(0,Math.min(100,x[k]));}catch(e){}
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(100,x));let animation;
function render(){for(const k of Object.keys(initial))$(k).firstElementChild.style.width=state[k]+'%';try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function act(type){const messages={pet:'Prrrr! Das ist schön! 😻',feed:'Mmmh, lecker! Danke! 🥛',play:'Juhu! Noch einmal! 🧶',sleep:'Gute Nacht ... zzz! 🌙'};if(type==='pet')state.joy=clamp(state.joy+12);if(type==='feed'){state.food=clamp(state.food+22);state.energy=clamp(state.energy+3)}if(type==='play'){if(state.energy<12){$('say').textContent='Ich bin müde. Lass mich schlafen! 💤';return;}state.joy=clamp(state.joy+19);state.energy=clamp(state.energy-12);state.food=clamp(state.food-7)}if(type==='sleep'){state.energy=clamp(state.energy+28);state.food=clamp(state.food-5)}$('say').textContent=messages[type];render();const cat=$('cat');cat.classList.add('happy');clearTimeout(animation);animation=setTimeout(()=>cat.classList.remove('happy'),400);}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));$('cat').addEventListener('click',()=>act('pet'));$('cat').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('pet')}});render();})();
</script></body></html>
